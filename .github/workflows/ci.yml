name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        host: [personal, work]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check flake
        run: nix flake check

      - name: Build
        run: nix build .#darwinConfigurations.${{ matrix.host }}.system
